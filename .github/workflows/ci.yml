name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  matlab-tests:
    name: MATLAB test suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          cache: true

      - name: Run test suites
        uses: matlab-actions/run-command@v2
        with:
          command: test_capacity_planning; test_summer_extension
